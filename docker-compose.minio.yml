name: wikitrend-minio

services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: wikitrend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wikitrend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wikitrend-local-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    container_name: wikitrend-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wikitrend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wikitrend-local-password}
      WIKITREND_S3_BUCKET: ${WIKITREND_S3_BUCKET:-wikitrend}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$WIKITREND_S3_BUCKET"
        mc anonymous set none "local/$$WIKITREND_S3_BUCKET"
        printf "" | mc pipe "local/$$WIKITREND_S3_BUCKET/bronze/pageviews/.keep"
        printf "" | mc pipe "local/$$WIKITREND_S3_BUCKET/silver/pageviews/.keep"
        printf "" | mc pipe "local/$$WIKITREND_S3_BUCKET/gold/pageviews/.keep"
        printf "" | mc pipe "local/$$WIKITREND_S3_BUCKET/validation/.keep"
        printf "" | mc pipe "local/$$WIKITREND_S3_BUCKET/serving/.keep"
        mc ls "local/$$WIKITREND_S3_BUCKET"
    restart: "no"

volumes:
  minio_data:
