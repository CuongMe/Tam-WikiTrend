services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka

  spark-master:
    image: bitnami/spark:4.0.1
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ..:/opt/wikitrend

  spark-worker:
    image: bitnami/spark:4.0.1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ..:/opt/wikitrend

  airflow-init:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      WIKITREND_PROJECT_HOME: /opt/wikitrend
      WIKITREND_START_DATE: ${WIKITREND_START_DATE:-2026-01-01}
      WIKITREND_END_DATE: ${WIKITREND_END_DATE:-2026-01-07}
      WIKITREND_PROJECT_ALLOWLIST: ${WIKITREND_PROJECT_ALLOWLIST:-en,vi,wikidata,commons}
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - postgres
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username $${AIRFLOW_ADMIN_USER}
      --password $${AIRFLOW_ADMIN_PASSWORD}
      --firstname Wiki
      --lastname Trend
      --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - airflow-init
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/app.Dockerfile
    environment:
      WIKITREND_GOLD_DIR: /app/data/gold
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/app.Dockerfile
    environment:
      WIKITREND_GOLD_DIR: /app/data/gold
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    command: streamlit run dashboard/app.py --server.address 0.0.0.0

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  airflow-logs:

