services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    command: server /data --console-address ":9001"
    environment: &minio-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-env
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${WIKITREND_MINIO_BUCKET:-wikitrend}"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  spark-master:
    build:
      context: ..
      dockerfile: infrastructure/spark.Dockerfile
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ..:/opt/wikitrend

  spark-worker:
    build:
      context: ..
      dockerfile: infrastructure/spark.Dockerfile
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ..:/opt/wikitrend

  airflow-init:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      WIKITREND_PROJECT_HOME: /opt/wikitrend
      WIKITREND_DOWNLOAD_PLAN: configs/pageview_download_plan.json
      WIKITREND_SOURCE_PROJECT_ALLOWLIST: en,en.m,vi,vi.m,commons.m,commons.m.m,www.wd
      WIKITREND_MINIO_BUCKET: ${WIKITREND_MINIO_BUCKET:-wikitrend}
      WIKITREND_SERVING_DB: /opt/wikitrend/data/serving/wikitrend.duckdb
      SPARK_MASTER_URL: spark://spark-master:7077
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username $${AIRFLOW_ADMIN_USER}
      --password $${AIRFLOW_ADMIN_PASSWORD}
      --firstname Wiki
      --lastname Trend
      --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infrastructure/airflow.Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ..:/opt/wikitrend
      - ../airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: scheduler

  kafka-replay:
    profiles: ["stream"]
    build:
      context: ..
      dockerfile: infrastructure/spark.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ..:/opt/wikitrend
    command: python streaming/kafka_replay.py --bootstrap-servers kafka:9092

  structured-streaming:
    profiles: ["stream"]
    build:
      context: ..
      dockerfile: infrastructure/spark.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ..:/opt/wikitrend
    command: >
      spark-submit --master spark://spark-master:7077
      --packages io.delta:delta-spark_2.13:4.0.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,org.apache.hadoop:hadoop-aws:3.4.0
      streaming/structured_streaming_trends.py
      --master spark://spark-master:7077 --bootstrap-servers kafka:9092

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/app.Dockerfile
    environment:
      WIKITREND_GOLD_DIR: /app/data/gold
      WIKITREND_SERVING_DB: /app/data/serving/wikitrend.duckdb
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/app.Dockerfile
    environment:
      WIKITREND_GOLD_DIR: /app/data/gold
      WIKITREND_SERVING_DB: /app/data/serving/wikitrend.duckdb
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    command: streamlit run dashboard/app.py --server.address 0.0.0.0

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  airflow-logs:
