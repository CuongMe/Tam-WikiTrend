[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrend"
version = "0.1.0"
description = "Local Wikimedia content-demand lakehouse for trend, anomaly, and forecast analytics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "delta-spark==4.0.0",
  "duckdb==1.1.3",
  "fastapi==0.115.6",
  "kafka-python==2.0.2",
  "lightgbm==4.5.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pyspark==4.0.1",
  "streamlit==1.41.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: local service or Spark integration coverage",
  "kafka_integration: requires a Kafka broker on localhost:9094",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
