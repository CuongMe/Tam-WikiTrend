[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrend"
version = "0.1.0"
description = "Local Wikimedia content-demand lakehouse for trend, anomaly, and forecast analytics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "deltalake==1.6.3",
  "delta-spark==4.0.0",
  "duckdb==1.1.3",
  "fastapi==0.115.6",
  "lightgbm==4.5.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "prophet==1.1.6",
  "pyarrow==18.1.0",
  "pyspark==4.0.1",
  "scikit-learn==1.9.0",
  "streamlit==1.41.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel==6.29.5",
  "jupyterlab==4.3.4",
  "nbclient==0.10.2",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: local service or Spark integration coverage",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

