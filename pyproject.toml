[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrend"
version = "0.1.0"
description = "Local Wikimedia content-demand lakehouse for trend, anomaly, and forecast analytics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "delta-spark>=4.0,<4.1",
  "duckdb>=1.1.0,<2",
  "fastapi>=0.115.0,<1",
  "kafka-python>=2.0.0,<3",
  "lightgbm>=4.5.0,<5",
  "numpy>=2.0,<2.3",
  "pandas>=2.2.0,<3",
  "pandera>=0.22.0,<1",
  "pyarrow>=18.0.0,<19",
  "pyspark>=4.0.0,<4.1",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "scikit-learn>=1.6.0",
  "streamlit>=1.41.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: local service or Spark integration coverage",
  "kafka_integration: requires a Kafka broker on localhost:9094",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
