[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikitrend"
version = "0.1.0"
description = "Local Wikimedia content-demand lakehouse for trend, anomaly, and forecast analytics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "kafka-python>=2.0.0",
  "pandas>=2.2.0",
  "pandera>=0.22.0",
  "pyarrow>=18.0.0",
  "pyspark>=4.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "scikit-learn>=1.6.0",
  "streamlit>=1.41.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

